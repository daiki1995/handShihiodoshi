<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ペットボトル獅子脅し</title>
    <!-- Tailwind CSS for clean UI overlays -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 bg-slate-950 text-slate-100">

    <!-- Main Game Frame Wrapper -->
    <div id="game-container" class="relative rounded-2xl overflow-hidden border-2 border-emerald-900/60 bg-emerald-950">
        
        <!-- Canvas Element -->
        <canvas id="gameCanvas" width="960" height="540"></canvas>

        <!-- TITLE SCREEN OVERLAY -->
        <div id="titleScreen" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-between p-6 z-20 transition-opacity duration-300">
            <div class="text-center mt-4">
                <div class="inline-block px-4 py-1 rounded-full bg-emerald-900/80 border border-emerald-500/30 text-emerald-300 text-xs sm:text-sm mb-2 tracking-widest">
                    和風防衛アクション
                </div>
                <h1 class="text-4xl sm:text-6xl font-black font-japanese tracking-wider text-amber-100 drop-shadow-[0_4px_12px_rgba(0,0,0,0.9)]">
                    ペットボトル<span class="text-emerald-400">獅子脅し</span>
                </h1>
                <p class="text-slate-300 text-xs sm:text-base mt-2 max-w-md">
                    水を注いで『カツン！』と重音波！<br>迫り来る野生動物をギリギリまで引きつけてビビらせろ！
                </p>
            </div>

            <!-- Instructions Card -->
            <div class="grid grid-cols-3 gap-2 sm:gap-4 my-2 max-w-xl w-full text-center text-xs sm:text-sm">
                <div class="bg-slate-900/80 p-3 rounded-xl border border-emerald-800/40">
                    <div class="text-amber-400 font-bold mb-1">❶ 水を注ぐ</div>
                    <div class="text-slate-300 text-2xl mb-1">🧃</div>
                    <p class="text-[11px] text-slate-400">長押しで竹筒に給水。専用ボタン連打でボトルを回復</p>
                </div>
                <div class="bg-slate-900/80 p-3 rounded-xl border border-emerald-800/40">
                    <div class="text-amber-400 font-bold mb-1">❷ 引きつける</div>
                    <div class="text-slate-300 text-2xl mb-1">🎯</div>
                    <p class="text-[11px] text-slate-400">目の前で鳴らすほど高得点＆CRITICAL！</p>
                </div>
                <div class="bg-slate-900/80 p-3 rounded-xl border border-emerald-800/40">
                    <div class="text-amber-400 font-bold mb-1">❸ 野生動物</div>
                    <div class="text-slate-300 text-2xl mb-1">🦌🐇🦁</div>
                    <p class="text-[11px] text-slate-400">突破されたらライフ減少（全3回）</p>
                </div>
            </div>

            <!-- Start Controls -->
            <div class="flex flex-col items-center gap-3 mb-2 w-full max-w-xs">
                <button id="startButton" class="w-full py-4 px-8 bg-gradient-to-r from-amber-600 via-emerald-600 to-teal-600 text-white font-black text-xl rounded-2xl shadow-lg hover:brightness-110 active:scale-95 transition-all animate-pulse-gentle border border-amber-300/30">
                    庭園を守る（ゲーム開始）
                </button>
                <div class="text-slate-400 text-xs">
                    【操作方法】 画面長押し / スペースキー長押し
                </div>
            </div>
        </div>

        <!-- GAME OVER SCREEN OVERLAY -->
        <div id="gameOverScreen" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 z-20">
            <div class="text-center max-w-md w-full bg-slate-900/90 p-6 sm:p-8 rounded-3xl border border-emerald-700/50 shadow-2xl">
                <div class="text-red-400 font-bold text-sm tracking-widest mb-1">GAME OVER</div>
                <h2 class="text-3xl sm:text-4xl font-black font-japanese text-amber-100 mb-4">庭園突破...</h2>

                <div class="bg-slate-950/80 p-4 rounded-2xl border border-slate-800 mb-6 text-left space-y-2">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">最終スコア:</span>
                        <span id="finalScore" class="text-2xl font-black text-amber-300">0</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">最高ハイスコア:</span>
                        <span id="finalHighScore" class="text-lg font-bold text-emerald-400">0</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">最大コンボ:</span>
                        <span id="finalMaxCombo" class="text-lg font-bold text-cyan-400">0</span>
                    </div>
                    <hr class="border-slate-800 my-2">
                    <div class="flex justify-between items-center">
                        <span class="text-xs text-slate-400">称号:</span>
                        <span id="rankTitle" class="text-base font-black font-japanese text-amber-400">ししおどし見習い</span>
                    </div>
                </div>

                <button id="restartButton" class="w-full py-4 px-6 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-lg rounded-xl shadow-lg active:scale-95 transition-all border border-emerald-400/30">
                    もう一度挑戦する
                </button>
            </div>
        </div>

        <!-- ON-SCREEN TOUCH CONTROL ZONE FOR MOBILE -->
        <div id="touchZone" class="absolute inset-0 z-10 cursor-pointer select-none"></div>
        <button id="bottleRefillButton" type="button" class="hidden absolute right-3 bottom-3 z-10 rounded-xl border border-sky-300/50 bg-sky-700/95 px-4 py-3 text-sm font-black text-white shadow-lg active:scale-95 hover:bg-sky-600 transition-transform">
            水を貯める<br><span class="text-xs text-sky-100">タップで +12%</span>
        </button>
    </div>

    <!-- Instructions Footnote -->
    <div class="mt-3 text-center text-xs text-slate-400 flex items-center gap-4">
        <span>🎵 BGM・効果音付き</span>
        <span>•</span>
        <span>📱 スマホ＆PC対応</span>
    </div>

    <script src="game.js"></script>
</body>
</html>
